[package]
name = "workforest"
version = "0.7.0"
edition = "2024"
description = "Isolated git worktrees for every piece of work: one tree per repo, on a shared branch"
license = "MIT"
repository = "https://github.com/Nixotica/workforest"
readme = "README.md"
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
