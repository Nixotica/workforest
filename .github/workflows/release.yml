name: Release

# Rolling releases: once CI passes on a commit pushed to main, the `release`
# branch moves forward to it. The Nix flake, the Claude Code plugin and cargo
# installs all follow `release`, so users only ever get commits that passed.
# The first commit to pass with a new Cargo.toml version is also tagged
# `v<version>` and gets a GitHub release, with a static binary for each
# platform in a tarball and their SHA256SUMS, which install.sh installs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Only ever a fast-forward, so a run that finishes late can't move
      # `release` back past a newer commit that was already released.
      - name: Move the release branch forward
        run: |
          if git rev-parse --verify --quiet origin/release >/dev/null &&
            ! git merge-base --is-ancestor origin/release "$SHA"; then
            echo "release is already ahead of $SHA"
            exit 0
          fi
          git push origin "$SHA:refs/heads/release"

      # Only a release made by this run gets binaries, built from its commit.
      # Re-running failed jobs reuses this job's output, so a failed upload
      # can be retried.
      - name: Tag a new version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            exit 0
          fi
          gh release create "v$version" --target "$SHA" \
            --title "workforest $version" --generate-notes
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build the ${{ matrix.target }} tarball
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # CI's Nix store cache for this platform, read only.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: false

      - name: Build the static binary and its tarball
        run: |
          nix build --print-build-logs .#release-tarball
          mkdir dist
          cp -L result "dist/$(basename "$(readlink result)" | cut -d- -f2-)"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: dist/

  publish:
    name: Attach the binaries and the skill to the release
    needs: [release, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      # The skill alone, for uploading to claude.ai or another agent: a
      # folder holding SKILL.md.
      - name: Zip the agent skill
        run: (cd plugin/skills && zip -r -X ../../dist/workforest-skill.zip workforest)

      - name: Upload them with their SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          cd dist
          sha256sum -- *.tar.gz workforest-skill.zip > SHA256SUMS
          gh release upload "$TAG" --clobber -- *.tar.gz workforest-skill.zip SHA256SUMS

  crates-io:
    name: Publish to crates.io
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Publishing needs a crates.io API token in the CARGO_REGISTRY_TOKEN
      # secret; until it is set, releases skip crates.io.
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "no CARGO_REGISTRY_TOKEN secret: not publishing to crates.io"
            exit 0
          fi
          cargo publish --locked
