name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # To replace older Nix store caches when main saves a new one.
  actions: write

jobs:
  nix:
    name: Build, test and install with Nix (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and aarch64 Linux, each with the static binary releases
        # ship, and Apple Silicon, the only one whose filesystem (APFS) clones
        # the files a cache graft copies.
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The Nix store, kept in the Actions cache per platform and lockfiles:
      # the toolchains and the crates' build, which change only when the
      # lockfiles do, are restored instead of rebuilt. Only pushes to main
      # save it, replacing that platform's older caches; pull requests read
      # main's and write nothing.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.event_name == 'push' }}
          purge: ${{ github.event_name == 'push' }}
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Tests, clippy, rustfmt and the package build
        run: nix flake check --print-build-logs

      - name: Install into a fresh profile
        run: nix profile install --profile "$RUNNER_TEMP/profile" .#default

      - name: Smoke-test the installed binary
        run: ci/smoke.sh "$RUNNER_TEMP/profile"

      # The static binary and tarball that a release ships, for the next job.
      - name: Build the release tarball
        run: |
          nix build --print-build-logs .#release-tarball
          mkdir dist
          cp -L result "dist/$(basename "$(readlink result)" | cut -d- -f2-)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball-${{ matrix.runner }}
          path: dist/

  install:
    name: Install with install.sh on a clean runner (${{ matrix.runner }})
    needs: nix
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: release-tarball-${{ matrix.runner }}
          path: dist

      - name: Install from the tarball, as a release serves it
        run: |
          (cd dist && shasum -a 256 -- *.tar.gz > SHA256SUMS)
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          WORKFOREST_RELEASES="file://$PWD/dist" WORKFOREST_VERSION="$version" sh install.sh

      - name: Smoke-test the installed binary
        run: ci/smoke.sh "$HOME/.local"

  plugin:
    name: Validate the Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.287

      - name: Validate the plugin and marketplace
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: node ci/validate-plugin.mjs

      - name: Test the session-start hook
        run: node ci/test-hook.mjs
